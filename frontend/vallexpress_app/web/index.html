<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo reemplaza el valor de `flutter build web --base-href` (la app se sirve en la raíz de app.vallexpress.com) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ValleXpress: pide comida, compras, farmacia y más a los negocios de tu zona.">
  <meta name="theme-color" content="#072530">

  <!-- iPhone: "Agregar a pantalla de inicio" la abre como una app (sin barra del navegador) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ValleXpress">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ValleXpress</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Mientras carga la app: fondo del logo en vez de una página en blanco */
    html, body { background: #072530; margin: 0; height: 100%; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
