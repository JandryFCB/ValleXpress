services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: vallexpress_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - vallexpress_network

  # Adminer para gestionar la BD (solo accesible desde tu máquina)
  adminer:
    image: adminer
    container_name: vallexpress_adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - vallexpress_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  vallexpress_network:
    driver: bridge
